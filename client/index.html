<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jomish Business Suite</title>
  <script>
    // Handle direct path routes (e.g. /order/slug, /book/slug)
    const path = window.location.pathname;
    
    if (path.startsWith('/order/') && path.length > 7) {
      const slug = path.slice(7);
      window.location.replace(`/order.html?slug=${slug}`);
    } else if (path.startsWith('/book/') && path.length > 6) {
      const slug = path.slice(6);
      window.location.replace(`/book.html?slug=${slug}`);
    } else if (path.startsWith('/c/') && path.length > 3) {
      const slug = path.slice(3);
      window.location.replace(`/c.html?slug=${slug}`);
    } else {
      // Default: Go to Login
      window.location.replace('/login.html');
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>
</head>
<body style="background: #0f1222;">
</body>
</html>
