<!DOCTYPE html>
<html lang="en">
<head>
  <meta property="og:title" content="Jomish Tech Hub">
  <meta property="og:description" content="Booking & Delivery Management Platform">
  <meta property="og:image" content="/img/logo.png">
  <meta property="og:type" content="website">
  <link rel="icon" href="/img/logo.png">
  <meta charset="UTF-8">
  <title>Jomish Business Suite</title>
  <script>
    // Handle direct path routes (e.g. /order/slug, /book/slug, /c/slug)
    const pathSegments = window.location.pathname.split('/').filter(Boolean);
    
    if (pathSegments.length >= 2) {
      const type = pathSegments[0];
      const slug = pathSegments[1];
      
      if (type === 'order') {
        window.location.replace(`/order.html?slug=${slug}`);
      } else if (type === 'book') {
        window.location.replace(`/book.html?slug=${slug}`);
      } else if (type === 'c') {
        window.location.replace(`/c.html?slug=${slug}`);
      } else {
        window.location.replace('/login.html');
      }
    } else {
      // Default: Go to Login
      window.location.replace('/login.html');
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>
</head>
<body style="background: #0f1222;">
</body>
</html>
