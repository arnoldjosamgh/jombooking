<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Jomish</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f4a81d">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-logo">
      <img src="https://ui-avatars.com/api/?name=J+M&background=1a2461&color=f4a81d&bold=true&rounded=true" alt="Jomish Logo">
    </div>
    <div class="login-title">Jomish Workforce</div>
    <div class="login-sub">Enterprise Platform</div>
    
    <div class="login-msg">Sign in to your workspace</div>

    <form id="login-form">
      <div class="login-form-group">
        <label>User ID / User Name</label>
        <input type="text" id="username" class="login-input" placeholder="Enter User ID or User Name" required>
      </div>

      <div class="login-form-group">
        <label>Password</label>
        <input type="password" id="password" class="login-input" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn-neon-cyan" id="login-btn">Sign In</button>
      <button type="button" class="btn-neon-magenta" onclick="toast('Demo Mode', 'Demo not available on this environment.', 'info')">Try Demo</button>
    </form>
    
    <div style="margin-top: 32px; font-size: 0.7rem; color: var(--text-muted); font-weight: 600;">Jomish Enterprise Workforce Platform</div>

    <!-- Biometric Login Section -->
    <div id="biometric-section" style="display: none; margin-top: 24px;">
      <button type="button" class="btn-neon-cyan" style="background: transparent; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); box-shadow: none;" onclick="loginWithBiometrics()">
        🔐 Use Biometrics (FaceID / TouchID)
      </button>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/app.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
