<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Jomish</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f4a81d">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
</head>
<body class="bg-gradient flex items-center justify-center" style="min-height: 100vh;">

  <div class="card" style="width: 100%; max-width: 400px; padding: 32px;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:24px;justify-content:center;">
      <div class="brand-icon">🧾</div>
      <span style="font-family:Outfit,sans-serif;font-weight:800;font-size:1.5rem;">Jomish</span>
    </div>

    <h2 class="text-center mb-20">Welcome Back</h2>

    <!-- Login Form -->
    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="e.g. jomish1" required>
      </div>
      
      <!-- Biometric Login Button (Hidden by default, shown if username has biometrics) -->
      <div id="biometric-section" style="display: none;" class="mb-20 text-center">
        <button type="button" class="btn btn-outline btn-full" onclick="loginWithBiometrics()" style="margin-bottom: 8px;">
          <span style="font-size:1.2rem">👆</span> Login with FaceID / TouchID
        </button>
        <div class="text-xs text-dim">or use your password below</div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>

      <button type="submit" class="btn btn-gold btn-full mt-8" id="login-btn">Log In</button>
    </form>
    
  </div>

  <div id="toast-container"></div>
  <script src="/js/app.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
