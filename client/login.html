<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Jomish</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f1222">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-logo">
      <div style="width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#1a2461,#0f1222);border:2px solid rgba(244,168,29,0.5);display:flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:0 0 24px rgba(244,168,29,0.3);">⚙️</div>
    </div>
    <div class="login-title">Jomish Tech Hub</div>
    <div class="login-sub">Booking & Delivery Management</div>

    <!-- Biometric auto-attempt spinner (shown while trying silently) -->
    <div id="bio-attempting" style="display:none; margin-bottom:24px;">
      <div class="spinner" style="border-top-color:var(--neon-cyan); margin:0 auto 12px;"></div>
      <p style="color:var(--text-muted); font-size:0.85rem;">Checking biometrics…</p>
    </div>

    <div class="login-msg" id="login-msg">Sign in to your workspace</div>

    <form id="login-form">
      <div class="login-form-group">
        <label>User ID</label>
        <input
          type="text"
          id="username"
          class="login-input"
          placeholder="e.g. TECH or JOM001"
          autocomplete="username"
          autocapitalize="characters"
          style="text-transform: uppercase; letter-spacing: 0.08em;"
          required
        >
      </div>

      <div class="login-form-group">
        <label>Password</label>
        <input type="password" id="password" class="login-input" placeholder="Enter password" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn-neon-cyan" id="login-btn">Sign In</button>
    </form>

    <div style="margin-top: 32px; font-size: 0.7rem; color: var(--text-muted); font-weight: 600; letter-spacing:0.05em;">JOMISH ENTERPRISE WORKFORCE PLATFORM</div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/app.js"></script>
  <script src="/js/login.js"></script>
  <script>
    // Force uppercase on username field
    document.getElementById('username').addEventListener('input', function() {
      const pos = this.selectionStart;
      this.value = this.value.toUpperCase();
      this.setSelectionRange(pos, pos);
    });
  </script>
</body>
</html>
