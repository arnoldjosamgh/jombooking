<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Jomish</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f4a81d">
  <link rel="icon" href="/img/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-logo">
      <img src="/img/logo.png" alt="Jomish Logo" style="width:130px; height:130px; object-fit:contain; filter: drop-shadow(0 0 18px rgba(244,168,29,0.5));">
    </div>
    <div class="login-title">Jomish Tech Hub</div>
    <div class="login-sub">Booking & Delivery Management</div>
    
    <div class="login-msg">Sign in to your workspace</div>

    <form id="login-form">
      <div class="login-form-group">
        <label>User ID / User Name</label>
        <input 
          type="text" 
          id="username" 
          class="login-input" 
          placeholder="Enter User ID or User Name" 
          autocomplete="username"
          autocapitalize="characters"
          style="text-transform: uppercase; letter-spacing: 0.05em;"
          required
        >
      </div>

      <div class="login-form-group">
        <label>Password</label>
        <input type="password" id="password" class="login-input" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn-neon-cyan" id="login-btn">Sign In</button>
    </form>
    
    <div style="margin-top: 32px; font-size: 0.7rem; color: var(--text-muted); font-weight: 600;">Jomish Enterprise Workforce Platform</div>

    <!-- Biometric Login Section -->
    <div id="biometric-section" style="display: none; margin-top: 24px;">
      <button type="button" class="btn-neon-cyan" style="background: transparent; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); box-shadow: none;" onclick="loginWithBiometrics()">
        🔐 Use Biometrics (FaceID / TouchID)
      </button>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/app.js"></script>
  <script src="/js/login.js"></script>
  <script>
    // Force uppercase on username field
    document.getElementById('username').addEventListener('input', function() {
      const pos = this.selectionStart;
      this.value = this.value.toUpperCase();
      this.setSelectionRange(pos, pos);
    });
  </script>
</body>
</html>
