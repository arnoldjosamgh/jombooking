<!DOCTYPE html>
<html lang="en">
<head>
  <meta property="og:title" content="Jomish Tech Hub">
  <meta property="og:description" content="Booking & Delivery Management Platform">
  <meta property="og:image" content="/img/logo.png">
  <meta property="og:type" content="website">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order | Jomish</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="top-nav">
    <a href="/" class="brand">
      <div class="brand-icon">🧾</div>
      <div>
        <div class="brand-name" id="biz-name">Loading...</div>
        <div class="brand-sub" id="biz-badge">🛍️ Order Menu</div>
      </div>
    </a>
    <div style="display:flex;gap:8px;align-items:center">
      <a id="call-btn" href="#" style="display:none; align-items:center; gap:6px; padding:8px 14px; background:#22c55e; color:#fff; border-radius:8px; font-size:0.85rem; font-weight:600; text-decoration:none;">
        📞 Call
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container" id="main-content" style="padding-top: 24px; padding-bottom: 100px;">
    <div class="grid grid-3" id="products-grid">
      <!-- Products injected here -->
    </div>
  </main>

  <!-- Cart Bar -->
  <div class="cart-bar" id="cart-bar">
    <div>
      <div class="cart-summary">Your Cart</div>
      <div class="cart-total"><span id="cart-items">0 items</span> · <span id="cart-price">$0.00</span></div>
    </div>
    <button class="btn btn-primary" onclick="placeOrder()" id="place-order-btn">Confirm Order →</button>
  </div>

  <!-- Product Modal -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal">
      <h2 class="modal-title" id="pm-title">Product</h2>
      <p class="modal-sub" id="pm-desc">Description</p>
      
      <div class="flex justify-between items-center mb-20">
        <div>
          <div class="text-gold font-bold text-lg" id="pm-price">$0.00</div>
          <div class="text-xs text-dim mt-8" id="pm-stock">0 available</div>
        </div>
        <div class="qty-row">
          <button class="qty-btn" onclick="changeQty(-1)">-</button>
          <div class="qty-num" id="pm-qty">1</div>
          <button class="qty-btn" onclick="changeQty(1)">+</button>
        </div>
      </div>

      <div class="flex justify-between items-center mt-24">
        <button class="btn btn-outline" onclick="closeModal('product-modal')">Cancel</button>
        <button class="btn btn-primary" onclick="addToCart()">Add to Cart — <span id="pm-total"></span></button>
      </div>
    </div>
  </div>


  <!-- Toasts & Scripts -->
  <div id="toast-container"></div>

  <!-- Floating Chat Button -->
  <button id="float-chat-btn" onclick="toggleClientChat()" style="display:none; position:fixed; bottom:24px; right:24px; width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,#5b67f6,#8b5cf6); color:#fff; border:none; font-size:1.4rem; box-shadow:0 4px 16px rgba(91,103,246,0.4); cursor:pointer; z-index:9000; align-items:center; justify-content:center;" title="Chat with seller">
    💬
  </button>

  <!-- Client Chat Modal -->
  <div id="client-chat-modal" style="display:none; position:fixed; bottom:90px; right:24px; width:320px; max-height:420px; background:#fff; border-radius:16px; box-shadow:0 8px 32px rgba(0,0,0,0.18); z-index:9001; flex-direction:column; overflow:hidden;">
    <div style="background:linear-gradient(135deg,#5b67f6,#8b5cf6); color:#fff; padding:12px 16px; font-weight:700; display:flex; justify-content:space-between; align-items:center;">
      <span id="client-chat-title">💬 Chat</span>
      <button onclick="toggleClientChat()" style="background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;">✕</button>
    </div>
    <div id="client-chat-msgs" style="flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; max-height:280px; background:#f8fafc;"></div>
    <div style="padding:10px; border-top:1px solid #e2e8f0; display:flex; gap:8px;">
      <input id="client-chat-input" type="text" placeholder="Type a message..." style="flex:1; border:1px solid #e2e8f0; border-radius:8px; padding:8px 12px; font-size:0.85rem; outline:none;"
        onkeydown="if(event.key==='Enter') sendClientMsg()">
      <button onclick="sendClientMsg()" style="background:#5b67f6; color:#fff; border:none; border-radius:8px; padding:8px 14px; cursor:pointer; font-weight:600;">Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/order.js"></script>
</body>
</html>
