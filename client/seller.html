<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Dashboard | Jomish</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f4a81d">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="overflow: hidden;"> <!-- Prevent body scroll, layout handles it -->
  
  <!-- Header -->
  <header class="top-nav">
    <div class="brand">
      <div class="brand-icon">🧾</div>
      <div>
        <div class="brand-name" id="dashboard-title">Seller Dashboard</div>
        <div class="brand-sub" id="dashboard-type">Select a business</div>
      </div>
    </div>
    
    <div>
      <select id="biz-select" onchange="onBizChange()" style="width: 200px; padding: 8px 12px; font-size: 0.85rem;">
        <option value="">Loading...</option>
      </select>
    </div>
  </header>

  <div id="no-biz" class="loading-center" style="height: calc(100vh - 70px);">
    <div style="font-size: 2.5rem; margin-bottom: 12px;">📊</div>
    <p>Select a business from the top menu to view the dashboard.</p>
  </div>

  <!-- Seller Layout -->
  <main class="seller-layout" id="seller-content" style="display: none;">
    
    <!-- Left Panel: List -->
    <div class="seller-list">
      <div class="list-header">
        <div class="tabs" style="margin: 0; width: 100%;">
          <button class="tab-btn" data-mode="orders" onclick="switchTab('orders')">Orders</button>
          <button class="tab-btn" data-mode="bookings" onclick="switchTab('bookings')">Bookings</button>
        </div>
      </div>
      <div id="items-list" style="flex: 1; overflow-y: auto;">
        <!-- List items injected here -->
      </div>
    </div>

    <!-- Right Panel: Details -->
    <div class="seller-detail" id="detail-panel">
      <div class="loading-center" style="height: 100%; color: var(--text-500);">
        <div style="font-size: 2rem; margin-bottom: 12px;">👈</div>
        <p>Select an item from the list to view details.</p>
      </div>
    </div>

  </main>

  <!-- Toasts & Scripts -->
  <div id="toast-container"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/seller.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
