<!DOCTYPE html>
<html lang="en">
<head>
  <meta property="og:title" content="Jomish Tech Hub">
  <meta property="og:description" content="Booking & Delivery Management Platform">
  <meta property="og:image" content="/img/logo.png">
  <meta property="og:type" content="website">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Dashboard | Jomish</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f4a81d">
  <link rel="icon" href="/img/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <!-- ZXing for barcode scanning -->
  <script type="text/javascript" src="https://unpkg.com/@zxing/browser@latest"></script>
  <!-- QRCode.js for QR generation -->
  <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
  <!-- Lucide SVG icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-light" style="overflow: hidden;">

  <!-- Header -->
  <header class="top-nav">
    <div class="brand">
      <!-- Icon: store/shop -->
      <div class="brand-icon" style="display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a2461,#0f1222);width:36px;height:36px;border-radius:10px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f4a81d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <div>
        <div class="brand-name" id="dashboard-title">Seller Dashboard</div>
        <div class="brand-sub" id="dashboard-type">Loading...</div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:8px">
      <select id="biz-select" onchange="onBizChange()" style="display:none;width:200px;padding:8px 12px;font-size:0.85rem;"></select>
      <button class="btn btn-outline" onclick="showOnboarding()" style="display:flex;align-items:center;gap:6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        Share Link
      </button>
      <button class="btn btn-outline" onclick="openSettings()" style="display:flex;align-items:center;gap:6px" title="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </button>
      <button class="btn btn-outline" onclick="logout()" style="display:flex;align-items:center;gap:6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </header>

  <!-- Demo Mode Banner (hidden by default) -->
  <div id="demo-banner" style="display:none; background:linear-gradient(90deg,#f59e0b,#f97316); color:#000; padding:10px 24px; font-size:0.82rem; font-weight:700; text-align:center; letter-spacing:0.04em; z-index:100;">
    ⚡ DEMO SIMULATOR — All actions are simulated. No data will be saved.
  </div>

  <!-- Loading state -->
  <div id="no-biz" class="loading-center" style="height:calc(100vh - 70px)">
    <div class="spinner" style="margin-bottom:16px"></div>
    <p class="text-dim">Loading your business...</p>
  </div>

  <!-- Main content (injected by JS) -->
  
  <div id="seller-tabs" class="seller-tabs" style="display:none; padding: 12px 24px; background: #fff; border-bottom: 1px solid #e2e8f0; gap: 12px; overflow-x: auto;">
  </div>
  <main class="seller-layout" id="seller-content" style="display:none; overflow-y: auto; height: calc(100vh - 120px);"></main>
  
  <button id="fab-pending" onclick="renderPending()" style="display:none; align-items:center; justify-content:center; position:fixed; bottom:24px; right:24px; width:64px; height:64px; border-radius:32px; background:var(--accent-orange); color:#fff; border:none; box-shadow:0 6px 16px rgba(244,168,29,0.4); z-index:9999; cursor:pointer; transition: transform 0.2s;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    <span id="fab-badge" style="position:absolute; top:8px; right:8px; background:#ef4444; color:white; border-radius:10px; padding:2px 6px; font-size:0.75rem; font-weight:bold; display:none;">0</span>
  </button>
  
  <template id="tpl-pending">
    <div style="padding:24px; max-width:800px; margin:0 auto;">
      <h3 class="mb-16">Pending Orders & Bookings</h3>
      <div id="pending-list"></div>
    </div>
  </template>
  
  <template id="tpl-history">
    <div style="padding:24px; max-width:800px; margin:0 auto;">
      <h3 class="mb-16">Transaction History</h3>
      <div id="history-list"></div>
    </div>
  </template>
  

  <!-- ── POS Template ── -->
  <template id="tpl-pos">
    <div class="pos-container">
      <div class="pos-main">
        <div class="flex justify-between items-center mb-16">
          <h3 style="display:flex;align-items:center;gap:8px">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b67f6" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            Point of Sale
          </h3>
          <div>
            <button class="btn btn-outline" onclick="openAddProductModal()" style="display:inline-flex;align-items:center;gap:6px">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Add Product
            </button>
            <button class="btn btn-primary ml-8" onclick="startBarcodeScanner()" style="display:inline-flex;align-items:center;gap:6px">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="4" height="16"/><rect x="8" y="4" width="2" height="16"/><rect x="12" y="4" width="3" height="16"/><rect x="17" y="4" width="2" height="16"/><rect x="21" y="4" width="1" height="16"/></svg>
              Scan Barcode
            </button>
          </div>
        </div>

        <div id="scanner-container" style="display:none;margin-bottom:16px">
          <video id="video" width="100%" height="200" style="border-radius:8px;background:#000"></video>
          <button class="btn btn-outline btn-full mt-8" onclick="stopBarcodeScanner()">Cancel Scan</button>
        </div>

        <div class="product-grid" id="pos-product-grid"></div>
      </div>

      <div class="pos-sidebar">
        <h3 style="display:flex;align-items:center;gap:8px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5b67f6" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          Current Order
        </h3>
        <div id="pos-cart-items" class="cart-items mt-16" style="flex:1;overflow-y:auto">
          <div class="text-dim text-center mt-24" style="font-size:0.85rem">Cart is empty</div>
        </div>
        <div class="pos-totals mt-16">
          <div class="flex justify-between mb-8 text-lg font-bold">
            <span>Total:</span>
            <span id="pos-total-amount">0.00</span>
          </div>
          <button class="btn btn-primary btn-full btn-lg" id="pos-checkout-btn" onclick="checkoutPos()" disabled
            style="display:flex;align-items:center;justify-content:center;gap:8px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/></svg>
            Checkout
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- ── Calendar Template ── -->
  <template id="tpl-calendar">
    <div class="calendar-container" style="padding:24px;height:100%;overflow-y:auto">
      <div class="flex justify-between items-center mb-20">
        <h3 style="display:flex;align-items:center;gap:8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b67f6" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Service Calendar
        </h3>
        <div style="display:flex;align-items:center;gap:8px">
          <button class="btn btn-outline" onclick="prevWeek()" style="padding:8px 14px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span id="calendar-week-label" class="font-bold" style="min-width:200px;text-align:center;font-size:0.9rem"></span>
          <button class="btn btn-outline" onclick="nextWeek()" style="padding:8px 14px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>
      <div id="calendar-grid" class="calendar-grid"></div>
    </div>
  </template>

  <!-- ── Onboarding / Share Link Modal ── -->
  <div id="onboarding-modal" class="modal-overlay" style="display:none">
    <div class="modal-content" style="max-width:480px;text-align:center">
      <div style="width:56px;height:56px;background:linear-gradient(135deg,#10b981,#059669);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <h2 class="mb-8">Share Your Business Link</h2>
      <p class="text-dim mb-24 text-sm">This is the permanent link your customers use to book or order from you.</p>

      <div class="mb-20">
        <label class="text-xs text-dim font-bold uppercase block mb-8 text-left">Your Client Link</label>
        <div class="flex gap-8">
          <input type="text" id="ob-client-link" readonly style="flex:1;color:var(--accent-green);font-weight:700;background:#f8fafc;padding:10px 14px;border-radius:8px;border:1px solid #e2e8f0;font-size:0.82rem">
          <button class="btn btn-primary" onclick="copyObLink()">Copy</button>
        </div>
      </div>

      <div class="mb-24" style="display:flex;flex-direction:column;align-items:center">
        <label class="text-xs text-dim font-bold uppercase block mb-8">QR Code for Customers</label>
        <div id="ob-qrcode" style="padding:12px;background:white;border-radius:8px;display:inline-block;border:1px solid #e2e8f0;margin-bottom:20px;"></div>
        
        <label class="text-xs text-dim font-bold uppercase block mb-8">Upload Logo (Optional)</label>
        <input type="file" id="ob-logo" accept="image/*" style="font-size:0.8rem;padding:6px;width:100%;max-width:250px;border:1px dashed #cbd5e1;border-radius:6px;">
        <button class="btn btn-outline" style="margin-top:8px;padding:6px 12px;font-size:0.75rem;" onclick="uploadSellerLogo()">Save Logo</button>
      </div>

      <button class="btn btn-primary btn-full" onclick="closeOnboarding()">Done</button>
    </div>
  </div>

  <!-- ── Add Product Modal ── -->
  <div id="add-product-modal" class="modal-overlay" style="display:none">
    <div class="modal-content">
      <h3 class="mb-16" style="display:flex;align-items:center;gap:8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b67f6" stroke-width="2"><path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        Add New Product
      </h3>
      <form id="add-product-form">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" id="ap-name" required placeholder="e.g. Coffee Latte">
        </div>
        <div class="form-group">
          <label>Price</label>
          <input type="number" step="0.01" id="ap-price" required placeholder="0.00">
        </div>
        <div class="form-group">
          <label>Barcode <span class="text-dim text-xs">(optional)</span></label>
          <input type="text" id="ap-barcode" placeholder="Scan or type barcode number">
        </div>
        <div class="form-group">
          <label>Initial Stock Quantity</label>
          <input type="number" id="ap-stock" value="0" min="0" required>
        </div>
        <div class="flex justify-end gap-8 mt-24">
          <button type="button" class="btn btn-outline" onclick="closeModal('add-product-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Add Product</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Booking Details Modal ── -->
  <div id="booking-modal" class="modal-overlay" style="display:none">
    <div class="modal-content">
      <h3 class="mb-16" style="display:flex;align-items:center;gap:8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b67f6" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Booking Details
      </h3>
      <div id="booking-details-content"></div>
      <div class="flex justify-end gap-8 mt-24">
        <button class="btn btn-outline" onclick="closeModal('booking-modal')">Close</button>
        <button class="btn btn-primary" id="complete-booking-btn" style="display:none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right:6px"><polyline points="20 6 9 17 4 12"/></svg>
          Mark Completed
        </button>
      </div>
    </div>
  </div>

  <!-- ── Settings Modal ── -->
  <div id="settings-modal" class="modal-overlay" style="display:none">
    <div class="modal-content" style="max-width:500px">
      <h3 class="mb-16" style="display:flex;align-items:center;gap:8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b67f6" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        Business Settings
      </h3>
      <form id="settings-form">
        <div class="form-group">
          <label>Opening Time</label>
          <input type="time" id="s-open-time" class="login-input" style="background:#f8fafc;color:#1a2461;border:1px solid #e2e8f0;">
        </div>
        <div class="form-group">
          <label>Closing Time</label>
          <input type="time" id="s-close-time" class="login-input" style="background:#f8fafc;color:#1a2461;border:1px solid #e2e8f0;">
        </div>
        <div class="form-group">
          <label>Lunch Break Start <span class="text-dim text-xs">(optional)</span></label>
          <input type="time" id="s-lunch-start" class="login-input" style="background:#f8fafc;color:#1a2461;border:1px solid #e2e8f0;">
        </div>
        <div class="form-group">
          <label>Lunch Break End <span class="text-dim text-xs">(optional)</span></label>
          <input type="time" id="s-lunch-end" class="login-input" style="background:#f8fafc;color:#1a2461;border:1px solid #e2e8f0;">
        </div>
        <div class="form-group">
          <label>Slot Duration (minutes)</label>
          <input type="number" id="s-duration" min="5" max="480" step="5" class="login-input" style="background:#f8fafc;color:#1a2461;border:1px solid #e2e8f0;">
        </div>
        <div class="form-group">
          <label>Currency Symbol</label>
          <input type="text" id="s-currency" maxlength="6" class="login-input" placeholder="e.g. UGX, $, €" style="background:#f8fafc;color:#1a2461;border:1px solid #e2e8f0;">
        </div>
        <div class="form-group">
          <label>Open Days</label>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;" id="s-open-days">
            <label style="display:flex;align-items:center;gap:4px;cursor:pointer;"><input type="checkbox" value="0"> Sun</label>
            <label style="display:flex;align-items:center;gap:4px;cursor:pointer;"><input type="checkbox" value="1"> Mon</label>
            <label style="display:flex;align-items:center;gap:4px;cursor:pointer;"><input type="checkbox" value="2"> Tue</label>
            <label style="display:flex;align-items:center;gap:4px;cursor:pointer;"><input type="checkbox" value="3"> Wed</label>
            <label style="display:flex;align-items:center;gap:4px;cursor:pointer;"><input type="checkbox" value="4"> Thu</label>
            <label style="display:flex;align-items:center;gap:4px;cursor:pointer;"><input type="checkbox" value="5"> Fri</label>
            <label style="display:flex;align-items:center;gap:4px;cursor:pointer;"><input type="checkbox" value="6"> Sat</label>
          </div>
        </div>
        <div class="flex justify-end gap-8 mt-24">
          <button type="button" class="btn btn-outline" onclick="closeModal('settings-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Settings</button>
        </div>
      </form>
    </div>
  </div>
  <!-- ── Chat Modal ── -->
  <div id="chat-modal" class="modal-overlay" style="display:none">
    <div class="modal-content" style="max-width:500px; display:flex; flex-direction:column; height:80vh;">
      <h3 class="mb-16" style="display:flex;align-items:center;gap:8px" id="chat-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b67f6" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Chat with Client
      </h3>
      <div id="chat-messages" style="flex:1; overflow-y:auto; border:1px solid #e2e8f0; border-radius:8px; padding:12px; background:#f8fafc; display:flex; flex-direction:column; gap:12px; margin-bottom:16px;">
        <!-- Messages loaded here -->
      </div>
      <form id="chat-form" style="display:flex; gap:8px;">
        <input type="text" id="chat-input" class="login-input" style="background:#fff;color:#1a2461;border:1px solid #e2e8f0;margin:0;" placeholder="Type a message..." required>
        <button type="submit" class="btn btn-primary" style="padding:0 24px;">Send</button>
      </form>
      <div class="flex justify-end gap-8 mt-16">
        <button class="btn btn-outline" onclick="closeChat()">Close</button>
      </div>
    </div>
  </div>

  <!-- ── Receipt Modal ── -->
  <div id="receipt-modal" class="modal-overlay" style="display:none">
    <div class="modal-content" style="max-width:400px">
      <div id="receipt-content"></div>
      <div class="flex justify-end gap-8 mt-16">
        <button class="btn btn-outline" onclick="closeModal('receipt-modal')">Close</button>
        <button class="btn btn-primary" onclick="window.print()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Print Receipt
        </button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/seller.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(e => console.error('SW error:', e));
    }
  </script>
</body>
</html>
