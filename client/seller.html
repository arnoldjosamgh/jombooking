<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Dashboard | Jomish</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f4a81d">
  <link rel="icon" href="/img/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  
  <!-- ZXing library for barcode scanning -->
  <script type="text/javascript" src="https://unpkg.com/@zxing/browser@latest"></script>
  <!-- QRCode.js for QR code generation -->
  <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
</head>
<body class="bg-light" style="overflow: hidden;">
  
  <!-- Header -->
  <header class="top-nav">
    <div class="brand">
      <div class="brand-icon">🧾</div>
      <div>
        <div class="brand-name" id="dashboard-title">Seller Dashboard</div>
        <div class="brand-sub" id="dashboard-type">Loading...</div>
      </div>
    </div>
    
    <div>
      <select id="biz-select" onchange="onBizChange()" style="display:none; width: 200px; padding: 8px 12px; font-size: 0.85rem;">
        <option value="">Loading...</option>
      </select>
      <button class="btn btn-outline ml-8" onclick="showOnboarding()">Share Link</button>
      <button class="btn btn-outline ml-8" onclick="logout()">Logout</button>
    </div>
  </header>

  <div id="no-biz" class="loading-center" style="height: calc(100vh - 70px);">
    <div style="font-size: 2.5rem; margin-bottom: 12px;">📊</div>
    <p>Loading your business...</p>
  </div>

  <!-- Main Seller Layout -->
  <main class="seller-layout" id="seller-content" style="display: none;">
    <!-- We will dynamically inject either POS UI or Calendar UI here -->
  </main>

  <!-- Product POS Template -->
  <template id="tpl-pos">
    <div class="pos-container">
      <div class="pos-main">
        <div class="flex justify-between items-center mb-16">
          <h3>Point of Sale (Products)</h3>
          <div>
            <button class="btn btn-outline" onclick="openAddProductModal()">+ Add Product</button>
            <button class="btn btn-primary ml-8" onclick="startBarcodeScanner()">📷 Scan Barcode</button>
          </div>
        </div>
        
        <div id="scanner-container" style="display:none; margin-bottom:16px;">
          <video id="video" width="100%" height="200" style="border: 1px solid #ccc; border-radius: 8px;"></video>
          <button class="btn btn-outline btn-full mt-8" onclick="stopBarcodeScanner()">Cancel Scan</button>
        </div>

        <div class="product-grid" id="pos-product-grid">
          <!-- Products injected here -->
        </div>
      </div>
      
      <div class="pos-sidebar">
        <h3>Current Order</h3>
        <div id="pos-cart-items" class="cart-items mt-16" style="flex:1; overflow-y:auto;">
          <div class="text-dim text-center mt-24">Cart is empty</div>
        </div>
        <div class="pos-totals mt-16">
          <div class="flex justify-between mb-8 text-lg font-bold">
            <span>Total:</span>
            <span id="pos-total-amount">0.00</span>
          </div>
          <button class="btn btn-primary btn-full btn-lg" id="pos-checkout-btn" onclick="checkoutPos()" disabled>Checkout</button>
        </div>
      </div>
    </div>
  </template>

  <!-- Service Calendar Template -->
  <template id="tpl-calendar">
    <div class="calendar-container" style="padding:24px; height:100%; overflow-y:auto;">
      <div class="flex justify-between items-center mb-24">
        <h3>Service Calendar</h3>
        <div>
          <button class="btn btn-outline" onclick="prevWeek()">◀ Prev Week</button>
          <span id="calendar-week-label" class="font-bold mx-16">Week of ...</span>
          <button class="btn btn-outline" onclick="nextWeek()">Next Week ▶</button>
        </div>
      </div>
      <div id="calendar-grid" class="calendar-grid">
        <!-- Calendar slots injected here -->
      </div>
    </div>
  </template>

  <!-- Onboarding / Share Modal -->
  <div id="onboarding-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 500px; text-align: center;">
      <h2 class="mb-8">Welcome to your Dashboard! 🎉</h2>
      <p class="text-dim mb-24">Your account is fully set up. Here is the permanent link for your customers to access your business.</p>
      
      <div class="mb-24">
        <label class="text-xs text-dim font-bold uppercase block mb-8 text-left">Your Client Link</label>
        <div class="flex gap-8">
          <input type="text" id="ob-client-link" class="login-input" readonly style="color: var(--accent-green); font-weight: bold; background: #f8fafc;">
          <button class="btn btn-primary" onclick="copyObLink()">Copy</button>
        </div>
      </div>

      <div class="mb-24 flex flex-col items-center justify-center">
        <label class="text-xs text-dim font-bold uppercase block mb-8">Client QR Code</label>
        <div id="ob-qrcode" style="padding: 16px; background: white; border-radius: 8px; display: inline-block;"></div>
      </div>

      <button class="btn btn-outline btn-full" onclick="closeOnboarding()">Let's Get Started</button>
    </div>
  </div>

  <!-- Add Product Modal -->
  <div id="add-product-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3 class="mb-16">Add New Product</h3>
      <form id="add-product-form">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" id="ap-name" required>
        </div>
        <div class="form-group">
          <label>Price</label>
          <input type="number" step="0.01" id="ap-price" required>
        </div>
        <div class="form-group">
          <label>Barcode (Optional)</label>
          <input type="text" id="ap-barcode" placeholder="Scan or type barcode">
        </div>
        <div class="form-group">
          <label>Initial Stock</label>
          <input type="number" id="ap-stock" value="0" required>
        </div>
        <div class="flex justify-end gap-8 mt-24">
          <button type="button" class="btn btn-outline" onclick="closeModal('add-product-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Add Product</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Booking Details Modal -->
  <div id="booking-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3 class="mb-16">Booking Details</h3>
      <div id="booking-details-content"></div>
      <div class="flex justify-end gap-8 mt-24">
        <button class="btn btn-outline" onclick="closeModal('booking-modal')">Close</button>
        <button class="btn btn-primary" id="complete-booking-btn" style="display:none;">Mark Completed</button>
      </div>
    </div>
  </div>

  <!-- Toasts & Scripts -->
  <div id="toast-container"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/seller.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
