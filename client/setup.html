<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Account | Jomish</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
</head>
<body class="bg-gradient flex items-center justify-center" style="min-height: 100vh;">

  <!-- Step 1: Set Password -->
  <div class="card" id="step-password" style="width: 100%; max-width: 400px; padding: 32px;">
    <h2 class="text-center mb-8">Welcome to Jomish</h2>
    <p class="text-center text-dim mb-24 text-sm">Please set a secure password to activate your seller account.</p>

    <form id="setup-form">
      <div class="form-group">
        <label for="password">New Password</label>
        <input type="password" id="password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-gold btn-full mt-8" id="setup-btn">Set Password</button>
    </form>
  </div>

  <!-- Step 2: Set Biometrics (FaceID/Fingerprint) -->
  <div class="card" id="step-biometrics" style="display: none; width: 100%; max-width: 400px; padding: 32px; text-align: center;">
    <div style="font-size: 3rem; margin-bottom: 16px;">👆</div>
    <h2 class="mb-8">Enable Quick Login</h2>
    <p class="text-dim mb-24 text-sm">Would you like to use FaceID or TouchID to log into your dashboard in the future?</p>

    <button class="btn btn-gold btn-full mb-12" onclick="setupBiometrics()">Yes, Enable Biometrics</button>
    <button class="btn btn-outline btn-full" onclick="finishSetup()">Skip for now</button>
  </div>

  <div id="toast-container"></div>
  <script src="/js/app.js"></script>
  <script src="/js/setup.js"></script>
</body>
</html>
