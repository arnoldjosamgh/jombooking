<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Dashboard | Jomish</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide icons via CDN -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #f8fafc; }
    lucide-icon, .icon { width:18px; height:18px; display:inline-block; vertical-align:middle; }
    .tech-header { background:#0f1222; border-bottom:1px solid rgba(255,255,255,0.06); }
    .tech-header .brand-name { color:#f4a81d; font-size:1.05rem; font-weight:800; }
    .tech-header .brand-sub  { color:rgba(255,255,255,0.45); font-size:0.75rem; }
    .tech-header .btn-logout {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.7);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .tech-header .btn-logout:hover { background: rgba(255,255,255,0.12); color: #fff; }

    .section-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .result-box {
      background: #0f1222;
      border-radius: 10px;
      padding: 20px 24px;
    }
    .result-username {
      font-family: monospace;
      font-size: 1.4rem;
      font-weight: 700;
      color: #f4a81d;
      letter-spacing: 0.12em;
      margin-bottom: 16px;
    }
    .link-group { margin-bottom: 16px; }
    .link-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #64748b; margin-bottom: 6px; }
    .link-row { display: flex; gap: 8px; }
    .link-input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 10px 14px;
      color: #e2e8f0;
      font-size: 0.8rem;
      font-family: monospace;
    }
    .link-copy-btn {
      background: rgba(91,103,246,0.15);
      border: 1px solid rgba(91,103,246,0.3);
      color: #818cf8;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .link-copy-btn:hover { background: rgba(91,103,246,0.3); color: #a5b4fc; }
    .link-copy-btn.green {
      background: rgba(16,185,129,0.12);
      border-color: rgba(16,185,129,0.25);
      color: #34d399;
    }
    .link-copy-btn.green:hover { background: rgba(16,185,129,0.25); }

    .status-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; }
    .status-dot.active  { background:#10b981; box-shadow:0 0 6px #10b981; }
    .status-dot.pending { background:#94a3b8; }

    table { width:100%; border-collapse: collapse; }
    thead th {
      padding: 10px 12px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #94a3b8;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
    }
    tbody tr { border-bottom: 1px solid #f1f5f9; transition: background 0.1s; }
    tbody tr:hover { background: #f8fafc; }
    tbody td { padding: 14px 12px; font-size: 0.875rem; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="top-nav tech-header">
    <div class="brand">
      <div style="width:36px;height:36px;background:linear-gradient(135deg,#1a2461,#0f1222);border-radius:10px;border:1px solid rgba(244,168,29,0.4);display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f4a81d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
      </div>
      <div style="margin-left:10px">
        <div class="brand-name">Tech Dashboard</div>
        <div class="brand-sub">Jomish Company Management</div>
      </div>
    </div>
    <button class="btn-logout" onclick="logout()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Logout
    </button>
  </header>

  <main class="container" style="padding-top:32px;padding-bottom:60px;max-width:1100px">

    <div class="grid grid-2 mb-24" style="align-items:start">

      <!-- Create Company Form -->
      <div class="card" style="padding:28px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5b67f6" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <h3 style="margin:0">Onboard New Company</h3>
        </div>

        <form id="create-company-form">
          <div class="form-group">
            <label>Company Name</label>
            <input type="text" id="cc-name" placeholder="e.g. Jomish Saloon" style="text-transform:capitalize">
          </div>

          <div class="grid grid-2" style="gap:12px">
            <div class="form-group" style="margin-bottom:0">
              <label>Prefix <span class="text-dim text-xs">(3–4 letters)</span></label>
              <input type="text" id="cc-prefix" placeholder="JOM" minlength="3" maxlength="4" required
                style="text-transform:uppercase;letter-spacing:0.1em;font-weight:700"
                autocapitalize="characters">
            </div>
            <div class="form-group" style="margin-bottom:0">
              <label>Number <span class="text-dim text-xs">(auto-padded)</span></label>
              <input type="number" id="cc-number" placeholder="1 → 001" min="1" max="999" required>
            </div>
          </div>

          <div class="form-group mt-12">
            <label>Business Type</label>
            <select id="cc-type" required>
              <option value="product">
                Product — Point of Sale (ordering)
              </option>
              <option value="service">
                Service — Booking & Calendar
              </option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary btn-full mt-8" id="cc-btn"
            style="display:flex;align-items:center;justify-content:center;gap:8px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Create Company & Generate Links
          </button>
        </form>
      </div>

      <!-- Links Result Panel -->
      <div>
        <div id="no-links-msg" class="card" style="padding:32px;text-align:center;color:#94a3b8">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5" style="margin:0 auto 12px;display:block"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <p class="text-sm">Create a company to generate access links.</p>
        </div>

        <div id="magic-link-result" style="display:none">
          <div class="result-box mb-16">
            <div class="text-xs" style="color:#64748b;margin-bottom:4px">USER ID CREATED</div>
            <div class="result-username" id="result-username">—</div>

            <div class="link-group">
              <div class="link-label">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#f4a81d" stroke-width="2" style="margin-right:4px;vertical-align:middle"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                1. Seller Setup Link <span style="color:#f4a81d">(Send to owner)</span>
              </div>
              <div class="link-row">
                <input type="text" id="magic-link-url" class="link-input" readonly>
                <button class="link-copy-btn" onclick="copyLink('magic-link-url')">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                  Copy
                </button>
              </div>
            </div>

            <div class="link-group" style="margin-bottom:0">
              <div class="link-label">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" style="margin-right:4px;vertical-align:middle"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                2. Permanent Client Link <span style="color:#34d399">(Share with customers)</span>
              </div>
              <div class="link-row">
                <input type="text" id="client-link-url" class="link-input" readonly style="color:#34d399">
                <button class="link-copy-btn green" onclick="copyLink('client-link-url')">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                  Copy
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Companies Table -->
    <div class="card" style="padding:0;overflow:hidden">
      <div style="padding:20px 24px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:10px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b67f6" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <h3 style="margin:0">Registered Companies</h3>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Company Name</th>
              <th>Type</th>
              <th>User ID</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="companies-list">
            <tr><td colspan="5" class="text-center text-dim" style="padding:32px">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <div id="toast-container"></div>
  <script src="/js/app.js"></script>
  <script src="/js/tech.js"></script>
</body>
</html>
