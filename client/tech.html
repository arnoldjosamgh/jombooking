<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jomish Business Suite</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
</head>
<body class="bg-light">

  <header class="top-nav">
    <div class="brand">
      <div class="brand-icon" style="font-size:1.5rem">⚙️</div>
      <div>
        <div class="brand-name">Tech Dashboard</div>
        <div class="brand-sub">Company Management</div>
      </div>
    </div>
    <div class="flex gap-12">
      <button class="btn btn-outline" onclick="logout()">Logout</button>
    </div>
  </header>

  <main class="container" style="padding-top: 32px; padding-bottom: 60px;">
    
    <div class="grid grid-2 mb-24">
      <!-- Create Company Form -->
      <div class="card">
        <h3 class="mb-16">Add New Company</h3>
        <form id="create-company-form" class="grid grid-2">
          <div class="form-group">
            <label class="text-xs text-dim font-bold uppercase">Prefix (3-4 Letters)</label>
            <input type="text" id="cc-prefix" placeholder="e.g. JOM" minlength="3" maxlength="4" pattern="[a-zA-Z]{3,4}" required>
          </div>
          <div class="form-group">
            <label class="text-xs text-dim font-bold uppercase">Number</label>
            <input type="number" id="cc-number" placeholder="e.g. 1 (becomes 001)" min="1" required>
          </div>
          <div class="form-group" style="grid-column: 1/-1">
            <label class="text-xs text-dim font-bold uppercase">Type</label>
            <select id="cc-type" required>
              <option value="product">Product (Ordering)</option>
              <option value="service">Service (Booking)</option>
            </select>
          </div>
          <div style="grid-column: 1 / -1;">
            <button type="submit" class="btn btn-primary btn-full mt-8" id="cc-btn">Create Company & Generate Links</button>
          </div>
        </form>
      </div>

      <!-- Links Result -->
      <div class="card-inset">
        <h3 class="mb-16">Access Links</h3>
        <div id="magic-link-result" style="display: none;">
          <div class="mb-16">
            <p class="text-xs text-dim font-bold uppercase mb-8">1. Seller Setup Link (Send to owner)</p>
            <div class="flex gap-8">
              <input type="text" id="magic-link-url" readonly style="font-size: 0.8rem;">
              <button class="btn btn-outline" onclick="copyMagicLink('magic-link-url')">Copy</button>
            </div>
          </div>
          <div>
            <p class="text-xs text-dim font-bold uppercase mb-8">2. Permanent Client Link (For customers)</p>
            <div class="flex gap-8">
              <input type="text" id="client-link-url" readonly style="font-size: 0.8rem; color: var(--accent-green);">
              <button class="btn btn-outline" onclick="copyMagicLink('client-link-url')">Copy</button>
            </div>
          </div>
        </div>
        <div id="no-links-msg" class="text-dim text-sm text-center mt-24">Create a company to generate access links.</div>
      </div>
    </div>

    <!-- Companies List -->
    <div class="card">
      <h3 class="mb-16">Existing Companies</h3>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Type</th>
              <th>Username</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="companies-list">
            <tr><td colspan="4" class="text-center">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>
  <script src="/js/app.js"></script>
  <script src="/js/tech.js"></script>
  <script>
    const origCreate = document.getElementById('create-company-form').onsubmit;
    document.getElementById('cc-btn').addEventListener('click', () => {
      document.getElementById('no-links-msg').style.display = 'none';
    });
  </script>
</body>
</html>
