<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Display | Jomish</title>
  <!-- Same stylesheet as the rest of the app -->
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* ── TV-specific layout (builds on top of app tokens) ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Outfit', 'Inter', sans-serif;
      background: var(--page-bg, #e6ebee);
      color: var(--text-primary, #334155);
      transition: background 0.3s, color 0.3s;
    }

    /* ── Header ─────────────────────────────────────────── */
    .tv-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      background: var(--nav-bg, #ffffff);
      border-bottom: 1px solid var(--nav-border, #f1f5f9);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .tv-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Same brand-icon style used in seller header */
    .tv-brand-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1a2461, #0f1222);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(26,36,97,0.25);
      overflow: hidden;
    }
    .tv-brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
    }

    .tv-biz-name {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-primary, #334155);
      letter-spacing: -0.02em;
    }
    .tv-biz-sub {
      font-size: 0.78rem;
      color: var(--text-sub, #64748b);
      margin-top: 1px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    /* Live pulse dot */
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-green, #00d26a);
      display: inline-block;
      animation: blink 1.8s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.25;} }

    .tv-clock {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent-orange, #fca311);
      letter-spacing: 0.03em;
      font-variant-numeric: tabular-nums;
    }

    /* ── Columns wrapper ─────────────────────────────────── */
    .tv-columns {
      display: flex;
      gap: 20px;
      padding: 20px 28px;
      height: calc(100vh - 90px);
    }

    /* ── Each column card ────────────────────────────────── */
    .tv-col {
      flex: 1;
      border-radius: var(--radius-lg, 20px);
      padding: 22px 22px 18px;
      display: flex;
      flex-direction: column;
      /* neumorphic card, same as app .card */
      background: var(--card-bg, #ffffff);
      border: 1px solid var(--card-border, #e2e8f0);
      box-shadow: var(--shadow-glow, 0 4px 15px rgba(0,0,0,0.05));
      position: relative;
      overflow: hidden;
    }

    /* Coloured top-bar accent — same concept as app badge colours */
    .tv-col::before {
      content: '';
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      border-radius: var(--radius-lg, 20px) var(--radius-lg, 20px) 0 0;
    }
    .col-preparing::before { background: var(--accent-orange, #fca311); }
    .col-ready::before     { background: var(--accent-green,  #00d26a); }

    /* ── Column header ───────────────────────────────────── */
    .tv-col-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding-top: 4px; /* clear the top bar */
    }

    .tv-col-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .col-preparing .tv-col-icon { background: rgba(252,163,17,0.12); }
    .col-ready     .tv-col-icon { background: rgba(0,210,106,0.12); }

    .tv-col-title {
      font-size: 1.15rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .col-preparing .tv-col-title { color: var(--accent-orange, #fca311); }
    .col-ready     .tv-col-title { color: var(--accent-green,  #00d26a); }

    .tv-col-count {
      margin-left: auto;
      min-width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
    }
    .col-preparing .tv-col-count { background: var(--accent-orange, #fca311); }
    .col-ready     .tv-col-count { background: var(--accent-green,  #00d26a); }

    /* ── Order list & items ─────────────────────────────── */
    .tv-order-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    .tv-order-item {
      padding: 16px 18px;
      border-radius: var(--radius-md, 14px);
      border: 1px solid var(--card-border, #e2e8f0);
      background: var(--page-bg, #e6ebee);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transition: box-shadow 0.2s;
    }
    .tv-order-item:hover {
      box-shadow: var(--shadow-glow, 0 4px 15px rgba(0,0,0,0.05));
    }

    .col-preparing .tv-order-item {
      border-left: 3px solid var(--accent-orange, #fca311);
    }
    .col-ready .tv-order-item {
      border-left: 3px solid var(--accent-green, #00d26a);
    }

    .order-num {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-primary, #334155);
      letter-spacing: -0.01em;
    }
    .col-preparing .order-num { color: var(--accent-orange, #fca311); }
    .col-ready     .order-num { color: var(--accent-green,  #00d26a); }

    .order-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary, #334155);
      margin-top: 2px;
    }
    .order-sub {
      font-size: 0.78rem;
      color: var(--text-sub, #64748b);
      margin-top: 3px;
    }

    .tv-empty {
      color: var(--text-sub, #64748b);
      text-align: center;
      font-size: 0.95rem;
      padding: 40px 0;
      opacity: 0.6;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.88) translateY(6px); }
      to   { opacity: 1; transform: scale(1)    translateY(0); }
    }
  </style>
</head>
<body>

  <!-- ── Header (mirrors seller dashboard header) ── -->
  <div class="tv-header">
    <div class="tv-brand">
      <div class="tv-brand-icon" id="biz-icon">
        <!-- Default store icon, replaced with logo if available -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f4a81d" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <div>
        <div class="tv-biz-name" id="biz-title">Loading…</div>
        <div class="tv-biz-sub">
          <span class="live-dot"></span>
          Order Status Board
        </div>
      </div>
    </div>

    <div class="tv-clock" id="tv-clock">--:--</div>
  </div>

  <!-- ── Columns ── -->
  <div class="tv-columns">
    <div class="tv-col col-preparing">
      <div class="tv-col-header">
        <div class="tv-col-icon">
          <!-- Hourglass / preparing icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fca311" stroke-width="2.5">
            <path d="M5 22h14M5 2h14M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/>
          </svg>
        </div>
        <div class="tv-col-title">Preparing</div>
        <div class="tv-col-count" id="preparing-count" style="display:none">0</div>
      </div>
      <div class="tv-order-list" id="preparing-list">
        <div class="tv-empty">No pending orders</div>
      </div>
    </div>

    <div class="tv-col col-ready">
      <div class="tv-col-header">
        <div class="tv-col-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00d26a" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <div class="tv-col-title">Order Ready - Come to Register</div>
        <div class="tv-col-count" id="ready-count" style="display:none">0</div>
      </div>
      <div class="tv-order-list" id="ready-list">
        <div class="tv-empty">Nothing ready yet</div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ── Apply saved dark/light mode (same as app) ──────────────────
    (function() {
      if (localStorage.getItem('jomish_theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();

    // ── Live clock ─────────────────────────────────────────────────
    function updateClock() {
      const now = new Date();
      document.getElementById('tv-clock').textContent =
        now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ── Main init ──────────────────────────────────────────────────
    let businessId = null;

    async function init() {
      const slug = new URLSearchParams(window.location.search).get('slug');
      if (!slug) { document.getElementById('biz-title').textContent = 'Invalid Link'; return; }

      try {
        const biz = await fetch(`/api/businesses/${slug}`).then(r => r.json());
        businessId = biz.id;
        document.getElementById('biz-title').textContent = biz.name;

        // Replace icon with logo if available
        if (biz.logo_url) {
          document.getElementById('biz-icon').innerHTML =
            `<img src="${biz.logo_url}" alt="${biz.name}">`;
        }

        loadOrders();
        setInterval(loadOrders, 10000);

        try {
          const socket = io();
          socket.emit('join:seller', { channel: biz.pusher_channel || `biz-${biz.id}` });
          socket.on('order:waiting', loadOrders);
          socket.on('order:status',  loadOrders);
        } catch(_) {}

      } catch(e) {
        document.getElementById('biz-title').textContent = 'Connection error';
      }
    }

    async function loadOrders() {
      if (!businessId) return;
      try {
        const orders = await fetch(`/api/orders/list/${businessId}`).then(r => r.json());
        const pending = orders.filter(o => o.status === 'pending');
        const ready   = orders.filter(o =>
          o.status === 'completed' &&
          (Date.now() - new Date(o.created_at).getTime()) < 15 * 60_000
        );
        renderList('preparing-list', 'preparing-count', pending, 'No pending orders');
        renderList('ready-list',     'ready-count',     ready,   'Nothing ready yet');
      } catch(e) { console.error(e); }
    }

    function renderList(listId, countId, items, emptyMsg) {
      const container  = document.getElementById(listId);
      const countEl    = document.getElementById(countId);

      // Group by receipt_number / id
      const grouped = {};
      items.forEach(i => {
        const key = i.receipt_number || i.id;
        if (!grouped[key]) grouped[key] = { id: key, name: i.client_name, loc: i.client_location };
      });
      const orders = Object.values(grouped).slice(0, 8);

      // Badge
      if (orders.length) {
        countEl.textContent = orders.length;
        countEl.style.display = 'flex';
      } else {
        countEl.style.display = 'none';
      }

      if (!orders.length) {
        container.innerHTML = `<div class="tv-empty">${emptyMsg}</div>`;
        return;
      }

      const newHtml = orders.map(o => {
        const num  = o.id.toString().replace(/^ORD-0+/, '');
        const loc  = o.loc ? `<div class="order-sub">Table ${o.loc}</div>` : '';
        return `
          <div class="tv-order-item">
            <div class="order-num">#${num}</div>
            <div class="order-name">${o.name}</div>
            ${loc}
          </div>`;
      }).join('');

      if (container.innerHTML !== newHtml) container.innerHTML = newHtml;
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
