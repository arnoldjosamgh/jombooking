<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Display | Jomish</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #fca311;
      --green:  #00d26a;
      --blue:   #5b67f6;
      --dark:   #0b0f1e;
      --dark2:  #111827;
      --card:   #161d30;
      --border: rgba(255,255,255,0.07);
      --text:   #f0f4ff;
      --muted:  rgba(255,255,255,0.45);
    }

    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      font-family: 'Outfit', 'Inter', sans-serif;
      background: var(--dark);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ═══════════════════════════════════════════════
       HEADER
    ═══════════════════════════════════════════════ */
    .tv-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      height: 88px;
      flex-shrink: 0;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .tv-brand { display: flex; align-items: center; gap: 18px; }

    .tv-brand-icon {
      width: 56px; height: 56px; border-radius: 16px;
      background: linear-gradient(135deg, #1a2461, #0f1222);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 6px 20px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    .tv-brand-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; }

    .tv-biz-name {
      font-size: 1.7rem; font-weight: 900; letter-spacing: -0.03em;
      color: var(--text);
    }
    .tv-biz-sub {
      font-size: 0.85rem; color: var(--muted); margin-top: 2px;
      display: flex; align-items: center; gap: 7px; letter-spacing: 0.05em;
      text-transform: uppercase; font-weight: 600;
    }
    .live-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--green);
      display: inline-block;
      animation: blink 1.8s ease-in-out infinite;
      box-shadow: 0 0 8px var(--green);
    }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.2;} }

    .tv-header-right {
      display: flex; align-items: center; gap: 20px;
    }

    .tv-clock {
      font-size: 2.8rem; font-weight: 900;
      color: var(--orange);
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 24px rgba(252,163,17,0.4);
    }

    .tv-fullscreen-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.2s;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .tv-fullscreen-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

    /* ═══════════════════════════════════════════════
       BODY SPLIT
    ═══════════════════════════════════════════════ */
    .tv-body {
      display: flex;
      height: calc(100vh - 88px);
    }

    /* ═══════════════════════════════════════════════
       ORDERS PANEL (left 56%)
    ═══════════════════════════════════════════════ */
    .tv-orders-panel {
      flex: 0 0 56%;
      display: flex;
      gap: 20px;
      padding: 24px 16px 24px 28px;
      overflow: hidden;
    }

    /* ─ Column ─ */
    .tv-col {
      flex: 1;
      border-radius: 24px;
      padding: 0;
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    /* Colored top accent */
    .tv-col::before {
      content: '';
      position: absolute; inset: 0 0 auto 0;
      height: 5px;
      border-radius: 24px 24px 0 0;
    }
    .col-preparing::before { background: linear-gradient(90deg, var(--orange), #f97316); }
    .col-ready::before     { background: linear-gradient(90deg, var(--green), #10b981); }

    /* Column header */
    .tv-col-header {
      display: flex; align-items: center; gap: 14px;
      padding: 28px 28px 18px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tv-col-icon {
      width: 52px; height: 52px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .col-preparing .tv-col-icon { background: rgba(252,163,17,0.15); }
    .col-ready     .tv-col-icon { background: rgba(0,210,106,0.15); }

    .tv-col-title {
      font-size: 1.25rem; font-weight: 900;
      text-transform: uppercase; letter-spacing: 0.1em;
      line-height: 1.15;
    }
    .col-preparing .tv-col-title { color: var(--orange); text-shadow: 0 0 20px rgba(252,163,17,0.35); }
    .col-ready     .tv-col-title { color: var(--green);  text-shadow: 0 0 20px rgba(0,210,106,0.35); }

    .tv-col-count {
      margin-left: auto;
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; font-weight: 900; color: #fff; flex-shrink: 0;
    }
    .col-preparing .tv-col-count { background: var(--orange); box-shadow: 0 0 16px rgba(252,163,17,0.5); }
    .col-ready     .tv-col-count { background: var(--green);  box-shadow: 0 0 16px rgba(0,210,106,0.5); }

    /* Order list */
    .tv-order-list {
      flex: 1; display: flex; flex-direction: column;
      gap: 12px; padding: 20px 22px; overflow-y: auto;
    }
    .tv-order-list::-webkit-scrollbar { width: 4px; }
    .tv-order-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

    /* Order card */
    .tv-order-item {
      padding: 20px 24px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transition: background 0.2s;
    }
    .tv-order-item:hover { background: rgba(255,255,255,0.07); }

    .col-preparing .tv-order-item { border-left: 4px solid var(--orange); }
    .col-ready     .tv-order-item { border-left: 4px solid var(--green); }

    /* ── Large readable text ── */
    .order-num {
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .col-preparing .order-num { color: var(--orange); text-shadow: 0 0 20px rgba(252,163,17,0.35); }
    .col-ready     .order-num { color: var(--green);  text-shadow: 0 0 20px rgba(0,210,106,0.35); }

    .order-name {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
      margin-top: 6px;
    }
    .order-sub {
      font-size: 1.05rem;
      color: var(--muted);
      margin-top: 4px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    /* Empty state */
    .tv-empty {
      color: var(--muted);
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 40px 0;
      opacity: 0.7;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.88) translateY(8px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ═══════════════════════════════════════════════
       MEDIA / SLIDESHOW PANEL (right 44%)
    ═══════════════════════════════════════════════ */
    .tv-media-panel {
      flex: 0 0 44%;
      padding: 24px 28px 24px 4px;
      display: flex;
      flex-direction: column;
    }

    .tv-slideshow {
      flex: 1;
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      background: #09101f;
      border: 1px solid var(--border);
      box-shadow: 0 8px 48px rgba(0,0,0,0.6);
    }

    /* Slide */
    .tv-slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
    }
    .tv-slide.active { opacity: 1; pointer-events: auto; }

    .tv-slide-img   { width: 100%; height: 100%; object-fit: cover; }
    .tv-slide-video { width: 100%; height: 100%; object-fit: cover; }

    /* Text / offer slide — designed to read from across the room */
    .tv-slide-text {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 48px;
      background: radial-gradient(ellipse at 30% 40%, #1a1060 0%, #0b0f1e 55%, #0f1e10 100%);
      text-align: center;
      gap: 0;
    }
    .offer-label {
      font-size: 1rem; font-weight: 800;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--orange);
      padding: 6px 24px;
      border: 2px solid rgba(252,163,17,0.5);
      border-radius: 32px;
      margin-bottom: 28px;
      text-shadow: 0 0 16px rgba(252,163,17,0.5);
      box-shadow: 0 0 20px rgba(252,163,17,0.15) inset;
    }
    .offer-body {
      font-size: clamp(2rem, 5.5vw, 4.5rem);
      font-weight: 900;
      color: #fff;
      line-height: 1.2;
      text-shadow: 0 4px 32px rgba(0,0,0,0.6);
      white-space: pre-wrap;
      letter-spacing: -0.01em;
    }
    .offer-sub {
      margin-top: 28px;
      font-size: 1rem;
      color: rgba(255,255,255,0.35);
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* No-media placeholder */
    .tv-no-media {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: rgba(255,255,255,0.2);
      gap: 16px; font-size: 1rem;
      text-align: center; padding: 32px;
      font-weight: 600; letter-spacing: 0.05em;
    }

    /* Slide progress bar */
    .tv-progress-bar {
      position: absolute; top: 0; left: 0; height: 4px;
      background: linear-gradient(90deg, var(--orange), var(--green));
      width: 0; z-index: 20;
      transition: width linear;
      box-shadow: 0 0 8px rgba(252,163,17,0.5);
    }

    /* Dots */
    .tv-dots {
      position: absolute; bottom: 18px; left: 0; right: 0;
      display: flex; justify-content: center; gap: 7px; z-index: 20;
    }
    .tv-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,0.25);
      transition: all 0.35s;
    }
    .tv-dot.active {
      background: #fff; width: 22px; border-radius: 4px;
      box-shadow: 0 0 8px rgba(255,255,255,0.5);
    }

    /* Logo watermark */
    .tv-media-logo {
      position: absolute; top: 16px; right: 16px; z-index: 25;
      width: 42px; height: 42px; border-radius: 12px; overflow: hidden;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(10px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
    }
    .tv-media-logo img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <div class="tv-header">
    <div class="tv-brand">
      <div class="tv-brand-icon" id="biz-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f4a81d" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <div>
        <div class="tv-biz-name" id="biz-title">Loading…</div>
        <div class="tv-biz-sub">
          <span class="live-dot"></span>
          Order Status Board
        </div>
      </div>
    </div>

    <div class="tv-header-right">
      <div class="tv-clock" id="tv-clock">--:--</div>
      <button class="tv-fullscreen-btn" onclick="toggleFullscreen()" id="fs-btn" title="Toggle fullscreen">
        ⛶ Fullscreen
      </button>
    </div>
  </div>

  <!-- ── Body ── -->
  <div class="tv-body">

    <!-- Orders panel -->
    <div class="tv-orders-panel">

      <!-- Preparing column -->
      <div class="tv-col col-preparing">
        <div class="tv-col-header">
          <div class="tv-col-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fca311" stroke-width="2.5">
              <path d="M5 22h14M5 2h14M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/>
            </svg>
          </div>
          <div class="tv-col-title">⏳ Preparing</div>
          <div class="tv-col-count" id="preparing-count" style="display:none">0</div>
        </div>
        <div class="tv-order-list" id="preparing-list">
          <div class="tv-empty">No orders yet</div>
        </div>
      </div>

      <!-- Ready column -->
      <div class="tv-col col-ready">
        <div class="tv-col-header">
          <div class="tv-col-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#00d26a" stroke-width="2.5">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <div class="tv-col-title">✅ Ready — Collect Now</div>
          <div class="tv-col-count" id="ready-count" style="display:none">0</div>
        </div>
        <div class="tv-order-list" id="ready-list">
          <div class="tv-empty">Nothing ready yet</div>
        </div>
      </div>

    </div>

    <!-- Media slideshow panel -->
    <div class="tv-media-panel">
      <div class="tv-slideshow" id="tv-slideshow">
        <div class="tv-no-media" id="tv-no-media">
          <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          <div>Add photos, videos<br>or offer banners<br>from the seller dashboard</div>
        </div>
        <div class="tv-progress-bar" id="tv-progress-bar"></div>
        <div class="tv-dots" id="tv-dots"></div>
        <div class="tv-media-logo" id="tv-media-logo" style="display:none">
          <img id="tv-logo-img" src="" alt="logo">
        </div>
      </div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ── Apply saved dark/light mode ─────────────────────────
    (function() {
      // Always force dark for TV
      document.documentElement.setAttribute('data-theme', 'dark');
    })();

    // ── Clock ───────────────────────────────────────────────
    function updateClock() {
      document.getElementById('tv-clock').textContent =
        new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ── Fullscreen ──────────────────────────────────────────
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        document.getElementById('fs-btn').textContent = '✕ Exit';
      } else {
        document.exitFullscreen();
        document.getElementById('fs-btn').textContent = '⛶ Fullscreen';
      }
    }
    document.addEventListener('fullscreenchange', () => {
      const btn = document.getElementById('fs-btn');
      if (!document.fullscreenElement) btn.textContent = '⛶ Fullscreen';
    });

    // Auto-enter fullscreen after 3 seconds (user can cancel with Esc)
    setTimeout(() => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }, 3000);

    // ── State ───────────────────────────────────────────────
    let businessId   = null;
    let businessSlug = null;
    let mediaItems   = [];
    let slideIndex   = 0;
    let slideTimer   = null;

    // ── Init ────────────────────────────────────────────────
    async function init() {
      const slug = new URLSearchParams(window.location.search).get('slug');
      if (!slug) { document.getElementById('biz-title').textContent = 'Missing ?slug= in URL'; return; }
      businessSlug = slug;

      try {
        const biz = await fetch(`/api/businesses/${slug}`).then(r => r.json());
        businessId = biz.id;
        document.getElementById('biz-title').textContent = biz.name;
        document.title = `${biz.name} — TV Display`;

        if (biz.logo_url) {
          document.getElementById('biz-icon').innerHTML =
            `<img src="${biz.logo_url}" alt="${biz.name}" style="width:100%;height:100%;object-fit:cover;border-radius:16px">`;
          document.getElementById('tv-logo-img').src = biz.logo_url;
          document.getElementById('tv-media-logo').style.display = 'block';
        }

        loadOrders();
        loadMedia();
        setInterval(loadOrders, 8000);
        setInterval(loadMedia, 45000);

        // Real-time socket
        try {
          const socket = io();
          socket.emit('join:seller', { channel: biz.pusher_channel || `biz-${biz.id}` });
          socket.on('order:waiting', loadOrders);
          socket.on('order:status',  loadOrders);
        } catch(_) {}

      } catch(e) {
        document.getElementById('biz-title').textContent = 'Connection error — check network';
      }
    }

    // ── Orders ──────────────────────────────────────────────
    async function loadOrders() {
      if (!businessId) return;
      try {
        const orders = await fetch(`/api/orders/list/${businessId}`).then(r => r.json());
        const pending = orders.filter(o => o.status === 'pending');
        const ready   = orders.filter(o => o.status === 'completed').slice(0, 8);
        
        renderOrderList('preparing-list', 'preparing-count', pending, 'No orders yet');
        renderOrderList('ready-list',     'ready-count',     ready,   'Nothing ready yet');
      } catch(e) { console.error('[orders]', e); }
    }

    function renderOrderList(listId, countId, items, emptyMsg) {
      const container = document.getElementById(listId);
      const countEl   = document.getElementById(countId);

      // Group by order group or receipt number
      const grouped = {};
      items.forEach(i => {
        const key = i.order_group_id || i.receipt_number || i.id;
        if (!grouped[key]) {
          grouped[key] = {
            receipt: i.receipt_number || ('#' + i.id),
            name:    i.client_name,
            loc:     i.client_location
          };
        }
      });
      const orders = Object.values(grouped).slice(0, 6); // max 6 on screen

      if (orders.length) {
        countEl.textContent = orders.length;
        countEl.style.display = 'flex';
      } else {
        countEl.style.display = 'none';
      }

      if (!orders.length) {
        container.innerHTML = `<div class="tv-empty">${emptyMsg}</div>`;
        return;
      }

      const newHtml = orders.map(o => {
        const num = (o.receipt || '').replace(/^ORD-0+/, '#').replace(/^ORD-/, '#') || '#?';
        const loc = o.loc ? `<div class="order-sub">📍 ${o.loc}</div>` : '';
        return `
          <div class="tv-order-item">
            <div class="order-num">${num}</div>
            <div class="order-name">${o.name}</div>
            ${loc}
          </div>`;
      }).join('');

      if (container.innerHTML !== newHtml) container.innerHTML = newHtml;
    }

    // ── Media Slideshow ─────────────────────────────────────
    async function loadMedia() {
      if (!businessSlug) return;
      try {
        const items = await fetch(`/api/tv-media/${businessSlug}`).then(r => r.json());
        const ids = items.map(i => i.id).join(',');
        if (ids !== mediaItems.map(i => i.id).join(',')) {
          mediaItems = items;
          buildSlides();
        }
      } catch(e) { console.error('[tv-media]', e); }
    }

    function buildSlides() {
      const slideshow = document.getElementById('tv-slideshow');
      const noMedia   = document.getElementById('tv-no-media');
      const dotsEl    = document.getElementById('tv-dots');

      slideshow.querySelectorAll('.tv-slide').forEach(s => s.remove());
      clearSlideTimer();

      if (!mediaItems.length) {
        noMedia.style.display = 'flex';
        dotsEl.innerHTML = '';
        return;
      }
      noMedia.style.display = 'none';

      mediaItems.forEach((item, idx) => {
        const slide = document.createElement('div');
        slide.className = 'tv-slide';
        slide.dataset.idx      = idx;
        slide.dataset.duration = item.duration || 6;

        if (item.type === 'image') {
          const img = document.createElement('img');
          img.className = 'tv-slide-img';
          img.src = item.content;
          img.alt = item.title || 'slide';
          slide.appendChild(img);

        } else if (item.type === 'video') {
          const vid = document.createElement('video');
          vid.className   = 'tv-slide-video';
          vid.src         = item.content;
          vid.muted       = true;
          vid.playsInline = true;
          vid.loop        = false;
          vid.addEventListener('ended', nextSlide);
          slide.appendChild(vid);
          slide.dataset.isVideo = '1';

        } else {
          // Text / offer banner
          const label = item.title
            ? `<div class="offer-label">${item.title}</div>` : '';
          slide.innerHTML = `
            <div class="tv-slide-text">
              ${label}
              <div class="offer-body">${item.content}</div>
              <div class="offer-sub">Powered by Jomish</div>
            </div>`;
        }

        slideshow.insertBefore(slide, document.getElementById('tv-progress-bar'));
      });

      // Dots
      dotsEl.innerHTML = mediaItems.map((_, i) =>
        `<div class="tv-dot" id="dot-${i}"></div>`
      ).join('');

      if (slideIndex >= mediaItems.length) slideIndex = 0;
      showSlide(slideIndex);
    }

    function showSlide(idx) {
      const slides = document.querySelectorAll('.tv-slide');
      if (!slides.length) return;
      idx = ((idx % slides.length) + slides.length) % slides.length;
      slideIndex = idx;

      // Hide all
      slides.forEach(s => {
        s.classList.remove('active');
        const v = s.querySelector('video');
        if (v) { v.pause(); v.currentTime = 0; }
      });

      // Dots
      document.querySelectorAll('.tv-dot').forEach((d, i) =>
        d.classList.toggle('active', i === idx)
      );

      // Activate current
      const current = slides[idx];
      current.classList.add('active');

      const dur     = parseInt(current.dataset.duration || 6) * 1000;
      const isVideo = current.dataset.isVideo === '1';

      // Animated progress bar
      const bar = document.getElementById('tv-progress-bar');
      bar.style.transition = 'none';
      bar.style.width = '0%';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        bar.style.transition = `width ${dur / 1000}s linear`;
        bar.style.width = '100%';
      }));

      clearSlideTimer();

      if (isVideo) {
        const vid = current.querySelector('video');
        if (vid) vid.play().catch(() => {});
        // Fallback if video stalls
        slideTimer = setTimeout(nextSlide, dur + 3000);
      } else {
        slideTimer = setTimeout(nextSlide, dur);
      }
    }

    function nextSlide() {
      if (!mediaItems.length) return;
      showSlide((slideIndex + 1) % mediaItems.length);
    }

    function clearSlideTimer() {
      if (slideTimer) { clearTimeout(slideTimer); slideTimer = null; }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
