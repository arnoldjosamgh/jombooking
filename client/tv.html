<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Display | Jomish</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red:    #e01010;
      --white:  #ffffff;
      --dark:   #000000;
      --card:   #000000;
      --border: #333333;
      --text:   #ffffff;
      --muted:  #888888;
    }

    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      font-family: 'Outfit', 'Inter', sans-serif;
      background: var(--dark);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ═══════════════════════════════════════════════
       HEADER
    ═══════════════════════════════════════════════ */
    .tv-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      height: 88px;
      flex-shrink: 0;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .tv-brand { display: flex; align-items: center; gap: 18px; }

    .tv-brand-icon {
      width: 56px; height: 56px; border-radius: 8px;
      background: var(--dark);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .tv-brand-icon img { width: 100%; height: 100%; object-fit: cover; }

    .tv-biz-name {
      font-family: 'Doto', monospace;
      font-size: 1.9rem; font-weight: 800; letter-spacing: -0.03em;
      color: var(--text);
    }
    .tv-biz-sub {
      font-size: 0.85rem; color: var(--muted); margin-top: 2px;
      display: flex; align-items: center; gap: 7px; letter-spacing: 0.05em;
      text-transform: uppercase; font-weight: 600;
    }
    .live-dot {
      display: none;
    }

    .tv-header-right {
      display: flex; align-items: center; gap: 20px;
    }

    .tv-clock {
      font-family: 'Doto', monospace;
      font-size: 3.5rem; font-weight: 800;
      color: var(--text);
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }

    .tv-fullscreen-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.2s;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .tv-fullscreen-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

    /* ═══════════════════════════════════════════════
       BODY SPLIT
    ═══════════════════════════════════════════════ */
    .tv-body {
      display: flex;
      height: calc(100vh - 88px);
    }

    /* ═══════════════════════════════════════════════
       ORDERS PANEL (left 56%)
    ═══════════════════════════════════════════════ */
    .tv-orders-panel {
      flex: 0 0 56%;
      display: flex;
      gap: 20px;
      padding: 24px 16px 24px 28px;
      overflow: hidden;
    }

    /* ─ Column ─ */
    .tv-col {
      flex: 1;
      border-radius: 24px;
      padding: 0;
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    .tv-col::before {
      content: '';
      position: absolute; inset: 0 0 auto 0;
      height: 4px;
    }
    .col-preparing::before { background: var(--border); }
    .col-ready::before     { background: var(--red); }

    /* Column header */
    .tv-col-header {
      display: flex; align-items: center; gap: 14px;
      padding: 28px 28px 18px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tv-col-icon {
      display: none;
    }

    .tv-col-title {
      font-family: 'Doto', monospace;
      font-size: 1.5rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em;
      line-height: 1.15;
    }
    .col-preparing .tv-col-title { color: var(--muted); }
    .col-ready     .tv-col-title { color: var(--text); }

    .tv-col-count {
      margin-left: auto;
      width: 40px; height: 40px; border-radius: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Doto', monospace;
      font-size: 1.3rem; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .col-preparing .tv-col-count { background: var(--border); color: var(--text); }
    .col-ready     .tv-col-count { background: var(--red); color: #fff; }

    /* Order list */
    .tv-order-list {
      flex: 1; display: flex; flex-direction: column;
      gap: 12px; padding: 20px 22px; overflow-y: auto;
    }
    .tv-order-list::-webkit-scrollbar { width: 4px; }
    .tv-order-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

    /* Order card */
    .tv-order-item {
      padding: 20px 24px;
      border-radius: 0;
      background-color: var(--dark);
      background-image: radial-gradient(rgba(255,255,255,0.12) 1px, transparent 1px);
      background-size: 10px 10px;
      border: 1px solid var(--border);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transition: all 0.2s;
      position: relative;
    }
    .tv-order-item:hover { transform: translateY(-2px); }

    .col-preparing .tv-order-item { 
      border-left: 4px solid var(--red);
      background-color: rgba(224, 16, 16, 0.05); /* Slight red tint */
      opacity: 0.9;
    }
    
    .col-ready .tv-order-item { 
      background-color: var(--white);
      background-image: radial-gradient(rgba(0,0,0,0.15) 1px, transparent 1px);
      border: 1px solid var(--white);
      border-left: 6px solid var(--red);
      box-shadow: 6px 6px 0px var(--red);
    }
    
    /* Animation for moving to ready */
    .animate-to-ready {
      animation: slideReady 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    
    @keyframes slideReady {
      0%   { transform: translateX(-50px) scale(0.9); opacity: 0; }
      100% { transform: translateX(0) scale(1); opacity: 1; }
    }

    /* ── Large readable text ── */
    .order-num {
      font-family: 'Doto', monospace;
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .col-preparing .order-num { color: var(--red); }
    .col-ready     .order-num { color: var(--dark); }

    .order-name {
      font-family: 'Doto', monospace;
      font-size: 1.35rem;
      font-weight: 700;
      margin-top: 6px;
    }
    .col-preparing .order-name { color: var(--red); opacity: 0.8; }
    .col-ready     .order-name { color: var(--dark); font-weight: 900; }
    
    .order-sub {
      font-family: 'Doto', monospace;
      font-size: 1.05rem;
      margin-top: 4px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .col-preparing .order-sub { color: var(--red); opacity: 0.6; }
    .col-ready     .order-sub { color: #555555; }

    /* Empty state */
    .tv-empty {
      color: var(--muted);
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 40px 0;
      opacity: 0.7;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.88) translateY(8px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ═══════════════════════════════════════════════
       MEDIA / SLIDESHOW PANEL (right 44%)
    ═══════════════════════════════════════════════ */
    .tv-media-panel {
      flex: 0 0 44%;
      padding: 24px 28px 24px 4px;
      display: flex;
      flex-direction: column;
    }

    .tv-slideshow {
      flex: 1;
      position: relative;
      border-radius: 0;
      overflow: hidden;
      background: var(--dark);
      border: 1px solid var(--border);
    }

    /* Slide */
    .tv-slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
    }
    .tv-slide.active { opacity: 1; pointer-events: auto; }

    .tv-slide-img   { width: 100%; height: 100%; object-fit: cover; }
    .tv-slide-video { width: 100%; height: 100%; object-fit: cover; }

    /* Text / offer slide — designed to read from across the room */
    .tv-slide-text {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 48px;
      background: var(--dark);
      text-align: center;
      gap: 0;
    }
    .offer-label {
      font-family: 'Doto', monospace;
      font-size: 1.2rem; font-weight: 800;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--text);
      padding: 6px 24px;
      border: 2px solid var(--border);
      border-radius: 0;
      margin-bottom: 28px;
    }
    .offer-body {
      font-family: 'Doto', monospace;
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
      white-space: pre-wrap;
      letter-spacing: -0.01em;
    }
    .offer-sub {
      margin-top: 28px;
      font-size: 1rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* No-media placeholder */
    .tv-no-media {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: rgba(255,255,255,0.2);
      gap: 16px; font-size: 1rem;
      text-align: center; padding: 32px;
      font-weight: 600; letter-spacing: 0.05em;
    }

    /* Slide progress bar */
    .tv-progress-bar {
      position: absolute; top: 0; left: 0; height: 4px;
      background: var(--red);
      width: 0; z-index: 20;
      transition: width linear;
    }

    /* Dots */
    .tv-dots {
      position: absolute; bottom: 18px; left: 0; right: 0;
      display: flex; justify-content: center; gap: 7px; z-index: 20;
    }
    .tv-dot {
      width: 7px; height: 7px; border-radius: 0;
      background: var(--border);
      transition: all 0.35s;
    }
    .tv-dot.active {
      background: var(--red); width: 22px;
    }

    /* Logo watermark */
    .tv-media-logo {
      position: absolute; top: 16px; right: 16px; z-index: 25;
      width: 42px; height: 42px; border-radius: 12px; overflow: hidden;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(10px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
    }
    .tv-media-logo img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <div class="tv-header">
    <div class="tv-brand">
      <div class="tv-brand-icon" id="biz-icon">
      </div>
      <div>
        <div class="tv-biz-name" id="biz-title">Loading…</div>
        <div class="tv-biz-sub">
          Order Status Board
        </div>
      </div>
    </div>

    <div class="tv-header-right">
      <div class="tv-clock" id="tv-clock">--:--</div>
      <button class="tv-fullscreen-btn" onclick="toggleFullscreen()" id="fs-btn" title="Toggle fullscreen">
        ⛶ Fullscreen
      </button>
    </div>
  </div>

  <!-- ── Body ── -->
  <div class="tv-body">

    <!-- Orders panel -->
    <div class="tv-orders-panel">

      <!-- Preparing column -->
      <div class="tv-col col-preparing">
        <div class="tv-col-header">
          <div class="tv-col-icon">
          </div>
          <div class="tv-col-title">Preparing</div>
          <div class="tv-col-count" id="preparing-count" style="display:none">0</div>
        </div>
        <div class="tv-order-list" id="preparing-list">
          <div class="tv-empty">No orders yet</div>
        </div>
      </div>

      <!-- Ready column -->
      <div class="tv-col col-ready">
        <div class="tv-col-header">
          <div class="tv-col-icon">
          </div>
          <div class="tv-col-title">Ready — Collect Now</div>
          <div class="tv-col-count" id="ready-count" style="display:none">0</div>
        </div>
        <div class="tv-order-list" id="ready-list">
          <div class="tv-empty">Nothing ready yet</div>
        </div>
      </div>

    </div>

    <!-- Media slideshow panel -->
    <div class="tv-media-panel">
      <div class="tv-slideshow" id="tv-slideshow">
        <div class="tv-no-media" id="tv-no-media">
          <div>Add photos, videos<br>or offer banners<br>from the seller dashboard</div>
        </div>
        <div class="tv-progress-bar" id="tv-progress-bar"></div>
        <div class="tv-dots" id="tv-dots"></div>
        <div class="tv-media-logo" id="tv-media-logo" style="display:none">
          <img id="tv-logo-img" src="" alt="logo">
        </div>
      </div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ── Apply saved dark/light mode ─────────────────────────
    (function() {
      // Always force dark for TV
      document.documentElement.setAttribute('data-theme', 'dark');
    })();

    // ── Clock ───────────────────────────────────────────────
    function updateClock() {
      document.getElementById('tv-clock').textContent =
        new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ── Fullscreen ──────────────────────────────────────────
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        document.getElementById('fs-btn').textContent = '✕ Exit';
      } else {
        document.exitFullscreen();
        document.getElementById('fs-btn').textContent = '⛶ Fullscreen';
      }
    }
    document.addEventListener('fullscreenchange', () => {
      const btn = document.getElementById('fs-btn');
      if (!document.fullscreenElement) btn.textContent = '⛶ Fullscreen';
    });

    // Auto-enter fullscreen repeatedly to ensure it stays fullscreen
    function enforceFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }
    
    setTimeout(enforceFullscreen, 3000);
    // Add click listener to enter fullscreen immediately on any interaction
    document.addEventListener('click', enforceFullscreen, { once: false });

    // ── State ───────────────────────────────────────────────
    let businessId   = null;
    let businessSlug = null;
    let mediaItems   = [];
    let slideIndex   = 0;
    let slideTimer   = null;

    // ── Init ────────────────────────────────────────────────
    async function init() {
      const slug = new URLSearchParams(window.location.search).get('slug');
      if (!slug) { document.getElementById('biz-title').textContent = 'Missing ?slug= in URL'; return; }
      businessSlug = slug;

      try {
        const biz = await fetch(`/api/businesses/${slug}`).then(r => r.json());
        businessId = biz.id;
        currentBiz = biz;
        document.getElementById('biz-title').textContent = biz.name;
        document.title = `${biz.name} — TV Display`;

        if (biz.logo_url) {
          document.getElementById('biz-icon').innerHTML =
            `<img src="${biz.logo_url}" alt="${biz.name}" style="width:100%;height:100%;object-fit:cover;border-radius:16px">`;
          document.getElementById('tv-logo-img').src = biz.logo_url;
          document.getElementById('tv-media-logo').style.display = 'block';
        }

        loadOrders();
        loadMedia();
        setInterval(loadOrders, 8000);
        setInterval(loadMedia, 45000);

        // Real-time socket
        try {
          const socket = io();
          socket.emit('join:seller', { channel: biz.pusher_channel || `biz-${biz.id}` });
          socket.on('order:waiting', loadOrders);
          socket.on('order:status',  loadOrders);
        } catch(_) {}

      } catch(e) {
        document.getElementById('biz-title').textContent = 'Connection error — check network';
      }
    }

    // ── Orders & Bookings ───────────────────────────────────
    let currentBiz = null;
    async function loadOrders() {
      if (!businessId || !currentBiz) return;
      try {
        let items = [];

        // Fetch Orders (for product / hybrid businesses)
        if (currentBiz.type === 'product' || currentBiz.type === 'both') {
          const orders = await fetch(`/api/orders/list/${businessId}`).then(r => r.json());
          items = items.concat(orders.map(o => ({
            id: o.id,
            receipt: o.receipt_number || ('#' + o.id),
            group_key: o.order_group_id || o.receipt_number || o.id,
            name: o.client_name,
            loc: o.client_location,
            status: o.status,
            date: new Date(o.created_at)
          })));
        }

        // Fetch Bookings (for service / hybrid businesses)
        if (currentBiz.type === 'service' || currentBiz.type === 'both') {
          const bookings = await fetch(`/api/bookings/list/${businessId}`).then(r => r.json());
          // Only include recent/upcoming bookings (past 24h) and normalize status
          const recentBookings = bookings.filter(b => new Date(b.booking_time) > new Date(Date.now() - 86400000));
          items = items.concat(recentBookings.map(b => ({
            id: b.id,
            receipt: b.receipt_number || ('#' + b.id),
            group_key: b.receipt_number || b.id,
            name: b.client_name,
            loc: b.client_location,
            status: b.status === 'confirmed' ? 'pending' : b.status, // Map confirmed -> pending
            date: new Date(b.booking_time)
          })));
        }

        // Sort by newest first
        items.sort((a, b) => b.date - a.date);

        const pending = items.filter(o => o.status === 'pending');
        const ready   = items.filter(o => o.status === 'ready').slice(0, 8);
        
        renderOrderList('preparing-list', 'preparing-count', pending, 'No orders yet');
        renderOrderList('ready-list',     'ready-count',     ready,   'Nothing ready yet');
      } catch(e) { console.error('[orders]', e); }
    }

    let previousReadyIds = [];

    function renderOrderList(listId, countId, items, emptyMsg) {
      const container = document.getElementById(listId);
      const countEl   = document.getElementById(countId);

      // Group by order group or receipt number, retaining order
      const groupedMap = new Map();
      items.forEach(i => {
        const key = i.group_key;
        if (!groupedMap.has(key)) {
          groupedMap.set(key, {
            id: i.id,
            receipt: i.receipt,
            name:    i.name,
            loc:     i.loc
          });
        }
      });
      const orders = Array.from(groupedMap.values()).slice(0, 6); // max 6 on screen

      if (orders.length) {
        countEl.textContent = orders.length;
        countEl.style.display = 'flex';
      } else {
        countEl.style.display = 'none';
      }

      if (!orders.length) {
        container.innerHTML = `<div class="tv-empty">${emptyMsg}</div>`;
        if (listId === 'ready-list') previousReadyIds = [];
        return;
      }

      const newHtml = orders.map(o => {
        const num = (o.receipt || '').replace(/^ORD-0+/, '#').replace(/^ORD-/, '#') || '#?';
        const loc = o.loc ? `<div class="order-sub">${o.loc}</div>` : '';
        
        let extraClass = '';
        if (listId === 'ready-list' && !previousReadyIds.includes(o.id)) {
          extraClass = 'animate-to-ready';
        }
        
        return `
          <div class="tv-order-item ${extraClass}">
            <div class="order-num">${num}</div>
            <div class="order-name">${o.name}</div>
            ${loc}
          </div>`;
      }).join('');

      if (container.innerHTML !== newHtml) {
        container.innerHTML = newHtml;
      }
      
      if (listId === 'ready-list') {
        previousReadyIds = orders.map(o => o.id);
      }
    }

    // ── Media Slideshow ─────────────────────────────────────
    async function loadMedia() {
      if (!businessSlug) return;
      try {
        const items = await fetch(`/api/tv-media/${businessSlug}`).then(r => r.json());
        const ids = items.map(i => i.id).join(',');
        if (ids !== mediaItems.map(i => i.id).join(',')) {
          mediaItems = items;
          buildSlides();
        }
      } catch(e) { console.error('[tv-media]', e); }
    }

    function buildSlides() {
      const slideshow = document.getElementById('tv-slideshow');
      const noMedia   = document.getElementById('tv-no-media');
      const dotsEl    = document.getElementById('tv-dots');

      slideshow.querySelectorAll('.tv-slide').forEach(s => s.remove());
      clearSlideTimer();

      if (!mediaItems.length) {
        noMedia.style.display = 'flex';
        dotsEl.innerHTML = '';
        return;
      }
      noMedia.style.display = 'none';

      mediaItems.forEach((item, idx) => {
        const slide = document.createElement('div');
        slide.className = 'tv-slide';
        slide.dataset.idx      = idx;
        slide.dataset.duration = item.duration || 6;

        if (item.type === 'image') {
          const img = document.createElement('img');
          img.className = 'tv-slide-img';
          img.src = item.content;
          img.alt = item.title || 'slide';
          slide.appendChild(img);

        } else if (item.type === 'video') {
          const vid = document.createElement('video');
          vid.className   = 'tv-slide-video';
          vid.src         = item.content;
          vid.muted       = true;
          vid.playsInline = true;
          vid.loop        = false;
          vid.addEventListener('ended', nextSlide);
          slide.appendChild(vid);
          slide.dataset.isVideo = '1';

        } else {
          // Text / offer banner
          const label = item.title
            ? `<div class="offer-label">${item.title}</div>` : '';
          slide.innerHTML = `
            <div class="tv-slide-text">
              ${label}
              <div class="offer-body">${item.content}</div>
              <div class="offer-sub">Powered by Jomish</div>
            </div>`;
        }

        slideshow.insertBefore(slide, document.getElementById('tv-progress-bar'));
      });

      // Dots
      dotsEl.innerHTML = mediaItems.map((_, i) =>
        `<div class="tv-dot" id="dot-${i}"></div>`
      ).join('');

      if (slideIndex >= mediaItems.length) slideIndex = 0;
      showSlide(slideIndex);
    }

    function showSlide(idx) {
      const slides = document.querySelectorAll('.tv-slide');
      if (!slides.length) return;
      idx = ((idx % slides.length) + slides.length) % slides.length;
      slideIndex = idx;

      // Hide all
      slides.forEach(s => {
        s.classList.remove('active');
        const v = s.querySelector('video');
        if (v) { v.pause(); v.currentTime = 0; }
      });

      // Dots
      document.querySelectorAll('.tv-dot').forEach((d, i) =>
        d.classList.toggle('active', i === idx)
      );

      // Activate current
      const current = slides[idx];
      current.classList.add('active');

      const dur     = parseInt(current.dataset.duration || 6) * 1000;
      const isVideo = current.dataset.isVideo === '1';

      // Animated progress bar
      const bar = document.getElementById('tv-progress-bar');
      bar.style.transition = 'none';
      bar.style.width = '0%';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        bar.style.transition = `width ${dur / 1000}s linear`;
        bar.style.width = '100%';
      }));

      clearSlideTimer();

      if (isVideo) {
        const vid = current.querySelector('video');
        if (vid) vid.play().catch(() => {});
        // Fallback if video stalls
        slideTimer = setTimeout(nextSlide, dur + 3000);
      } else {
        slideTimer = setTimeout(nextSlide, dur);
      }
    }

    function nextSlide() {
      if (!mediaItems.length) return;
      showSlide((slideIndex + 1) % mediaItems.length);
    }

    function clearSlideTimer() {
      if (slideTimer) { clearTimeout(slideTimer); slideTimer = null; }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
